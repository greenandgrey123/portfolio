<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penny Tristram &mdash; Original Art</title>
<meta name="description" content="Penny Tristram, original art and embroidery. Site being rebuilt; new site coming soon.">
<style>
  :root { --accent: #b3402f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #faf7f2;
    color: #2b2b2b;
    padding: 2rem;
  }
  main { max-width: 34rem; }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: normal;
    letter-spacing: 0.02em;
  }
  .rule {
    width: 3.5rem;
    height: 3px;
    background: var(--accent);
    margin: 1.4rem auto;
  }
  p { line-height: 1.7; font-size: 1.05rem; margin-bottom: 1.2rem; }
  .foot { color: #6b6b6b; font-size: 0.95rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Penny Tristram</h1>
  <div class="rule"></div>
  <p>Original art and embroidery.</p>
  <p>The website is being rebuilt and will return shortly, better than before.</p>
  <p class="foot">In the meantime, you can reach me at <a href="mailto:info@pennytristram.co.uk">info@pennytristram.co.uk</a>.</p>
</main>
</body>
</html>
